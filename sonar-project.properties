# SonarQube Configuration for Video Converter Project
# This file configures static analysis rules and can be customized

# Project identification
sonar.projectKey=video-converter
sonar.projectName=Video Converter
sonar.projectVersion=1.0.0

# Source code configuration
sonar.sources=src
sonar.tests=tests
sonar.cs.vstest.reportsPaths=tests/**/TestResults/*.trx
sonar.cs.opencover.reportsPaths=tests/**/coverage.opencover.xml

# Language and framework
sonar.language=cs
sonar.dotnet.version=10.0

# Exclusions
sonar.exclusions=**/bin/**,**/obj/**,**/node_modules/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/bin/**,**/obj/**

# Code coverage
sonar.cs.vstest.reportsPaths=tests/**/TestResults/*.trx
sonar.cs.opencover.reportsPaths=tests/**/coverage.opencover.xml

# Quality gates and rules configuration
# These can be customized based on project needs

# Security rules
sonar.cs.security.hotspots.enabled=true

# Code smells rules
sonar.cs.codeSmells.enabled=true

# Bug detection rules
sonar.cs.bugs.enabled=true

# Vulnerability detection rules
sonar.cs.vulnerabilities.enabled=true

# Duplicate code detection
sonar.cs.duplications.enabled=true
sonar.cs.duplications.minimum_tokens=100

# Complexity rules
sonar.cs.complexity.enabled=true
sonar.cs.complexity.maximum=15

# Maintainability rules
sonar.cs.maintainability.enabled=true

# Reliability rules
sonar.cs.reliability.enabled=true

# Custom rule configurations (can be overridden)
# Example: Disable specific rules
# sonar.cs.rules.S1000.enabled=false
# sonar.cs.rules.S1001.enabled=false

# Analysis timeout (in seconds)
sonar.cs.analysis.timeout=300

# Memory settings
sonar.cs.analysis.memory=2048
